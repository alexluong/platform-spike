# One file per stack; each defines services under its own profile (a, b, c, d, e, a2, g, ...).
#   DOCKER_HOST=ssh://cs-ws docker compose --profile a up -d --build
include:
  - stacks/a/compose.yaml
  - stacks/b/compose.yaml
  - stacks/c/compose.yaml
  - stacks/d/compose.yaml
  - stacks/e/compose.yaml
  - stacks/a2/compose.yaml
  - stacks/g/compose.yaml
