# Stack d: TypeScript (Hono) + Better Auth with the organization plugin + Cerbos + Postgres. SPEC §15.
#   DOCKER_HOST=ssh://cs-ws docker compose -p ps-d --profile d up -d --build
# No bind mounts: policies are baked into the Cerbos image, the app is built from ../../ts-org.
# Migrations (Better Auth's tables incl. organization/member/invitation, then the app's Drizzle
# migrations, which link to them) run idempotently at app start.
services:
  d-postgres:
    profiles: ["d"]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ps
      POSTGRES_PASSWORD: ps-dev-only
      POSTGRES_DB: ps
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=60"]
    volumes:
      - d-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ps -d ps"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 384m

  d-cerbos:
    profiles: ["d"]
    build: ./cerbos
    healthcheck:
      test: ["CMD", "/cerbos", "healthcheck", "--config=/etc/platform/config.yaml"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 256m

  d-app:
    profiles: ["d"]
    build: ../../ts-org
    depends_on:
      d-postgres: { condition: service_healthy }
      d-cerbos: { condition: service_healthy }
    environment:
      PORT: "8086"
      DATABASE_URL: postgres://ps:ps-dev-only@d-postgres:5432/ps
      CERBOS_ADDRESS: d-cerbos:3593
      AUTH_BASE_URL: http://localhost:8086
      # dev-only secret for the local stack
      AUTH_SECRET: d-stack-dev-only-secret-0b7c4e1f9a2d3c5e
      API_RESOURCE: urn:platform-spike:api
      # the suite signs in hundreds of users from one IP; production keeps it on and sets AUTH_IP_HEADER
      AUTH_RATE_LIMIT: "off"
      TEST_MODE: "1"
      TEST_SECRET: test-secret
    ports:
      - "8086:8086"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8086/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s
    mem_limit: 512m
    restart: unless-stopped

volumes:
  d-pgdata:
