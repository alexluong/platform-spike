# Stack h: Go app with an in-process OpenID provider (zitadel/oidc pkg/op) + SpiceDB, one Postgres.
#   DOCKER_HOST=ssh://cs-ws docker compose -p ps-h --profile h up -d --build
# Published: app 8094 only. The issuer is http://${STACK_H_HOST:-cs-ws.lab.alexluong.com}:8094/oidc,
# pinned by PUBLIC_URL (not read from Host headers), served by the app itself.
# Dev-only secrets below are placeholders for a local stack.

x-pg-dsn: &pgpass postgres-h-dev-pw

services:
  h-postgres:
    profiles: [h]
    build: ./postgres
    image: platform-spike-postgres:h
    command: ["postgres", "-c", "track_commit_timestamp=on", "-c", "max_connections=200"]
    environment:
      POSTGRES_PASSWORD: *pgpass
    volumes: [h-pg:/var/lib/postgresql/data]
    networks: [h-net]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 3s
      timeout: 5s
      retries: 30

  h-spicedb-migrate:
    profiles: [h]
    image: authzed/spicedb:v1.56.2
    command: ["datastore", "migrate", "head", "--datastore-engine=postgres",
              "--datastore-conn-uri=postgres://postgres:postgres-h-dev-pw@h-postgres:5432/spicedb?sslmode=disable"]
    networks: [h-net]
    depends_on:
      h-postgres: {condition: service_healthy}

  h-spicedb:
    profiles: [h]
    image: authzed/spicedb:v1.56.2
    command: ["serve", "--grpc-preshared-key=spicedb-h-dev-key", "--datastore-engine=postgres",
              "--datastore-conn-uri=postgres://postgres:postgres-h-dev-pw@h-postgres:5432/spicedb?sslmode=disable",
              "--datastore-revision-quantization-interval=100ms", "--http-enabled=false"]
    networks: [h-net]
    mem_limit: 512m
    depends_on:
      h-spicedb-migrate: {condition: service_completed_successfully}

  # Migrations (app + issuer tables) and the SpiceDB schema; nothing to provision elsewhere.
  h-bootstrap:
    profiles: [h]
    build: ../../go
    image: platform-spike-go:h
    command: ["bootstrap"]
    environment: &appenv
      PORT: "8094"
      DATABASE_URL: postgres://postgres:postgres-h-dev-pw@h-postgres:5432/app?sslmode=disable
      IDP: oidcop
      AUTHZ: spicedb
      SPICEDB_ENDPOINT: h-spicedb:50051
      SPICEDB_KEY: spicedb-h-dev-key
      PUBLIC_URL: http://${STACK_H_HOST:-cs-ws.lab.alexluong.com}:8094
      # Encrypts the signing keys in the DB; the same on every instance. Dev placeholder.
      ISSUER_SECRET: ${ISSUER_SECRET:-h-dev-issuer-secret-0123456789abcdef}
      API_AUDIENCE: platform-api
      LOGIN_CLIENT_ID: platform-cli
      # Loopback: any port matches (RFC 8252). 127.0.0.1, not localhost: cs-ws's dev proxy
      # rewrites localhost in redirects on ports 8090+.
      DRIVER_REDIRECT_URI: http://127.0.0.1/callback
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 24h
      # argon2id allocates 19 MiB per hash; without a GC target near mem_limit (256m) a
      # burst of logins leaves enough garbage for the kernel to OOM-kill the app.
      GOMEMLIMIT: 200MiB
      STACK_CONFIG: /tmp/stack.json
      TEST_MODE: "1"
      TEST_SECRET: ${TEST_SECRET:-test-secret}
    networks: [h-net]
    depends_on:
      h-postgres: {condition: service_healthy}
      h-spicedb: {condition: service_started}

  h-app:
    profiles: [h]
    image: platform-spike-go:h
    command: ["server"]
    environment: *appenv
    ports: ["8094:8094"]
    networks: [h-net]
    mem_limit: 256m
    restart: unless-stopped
    depends_on:
      h-bootstrap: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8094/healthz"]
      interval: 3s
      timeout: 5s
      retries: 40

  # A second instance on the same DB, not published (profile h2: `--profile h --profile h2`).
  # Used to check that keys, codes and tokens work across instances.
  h-app2:
    profiles: [h2]
    image: platform-spike-go:h
    command: ["server"]
    environment: *appenv
    networks: [h-net]
    mem_limit: 256m
    depends_on:
      h-bootstrap: {condition: service_completed_successfully}

networks:
  h-net: {}

volumes:
  h-pg: {}
